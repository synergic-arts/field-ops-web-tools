<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Cuaderno de campo local con exportación GeoJSON"><title>Field Notes · Field Ops Web Tools</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><main class="app"><header class="top"><a href="../../">← Field Ops Web Tools</a><span class="badge">local storage</span><h1>Field Notes</h1><p>Registra observaciones, toma la posición del dispositivo y expórtalas como GeoJSON.</p></header><section class="layout"><section class="panel"><h2>Nueva observación</h2><form id="form"><label for="title">Título</label><input id="title" required placeholder="Ej. Estructura de mampostería"><label for="category">Categoría</label><select id="category"><option>Arqueología</option><option>Cartografía histórica</option><option>Teledetección</option><option>Patrimonio</option><option>Otra</option></select><label for="notes">Notas</label><textarea id="notes" rows="5" placeholder="Descripción, estado, fuente, dudas…"></textarea><div class="coords"><div><label for="lat">Latitud</label><input id="lat" type="number" step="any" placeholder="40.4168"></div><div><label for="lng">Longitud</label><input id="lng" type="number" step="any" placeholder="-3.7038"></div></div><label class="file">Fotografía opcional<input id="photo" type="file" accept="image/*"></label><div class="actions"><button type="button" id="locate" class="secondary">Usar mi ubicación</button><button type="submit" class="primary">Guardar observación</button></div><p id="formStatus" class="hint" aria-live="polite"></p></form></section><section class="panel map-panel"><div class="toolbar"><div><h2>Mapa de observaciones</h2><p id="count" class="hint">0 observaciones</p></div><div class="actions"><button id="example" class="ghost">Añadir ejemplo</button><button id="export" class="secondary">Exportar GeoJSON</button><button id="clear" class="danger">Borrar todas</button></div></div><div id="map"></div><div id="list" class="list"></div></section></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script></body></html>
